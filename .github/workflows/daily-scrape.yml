name: Daily metrics scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily-metrics-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape all works
        run: npm run scrape:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_CONCURRENCY: 6
          SCRAPE_ATTEMPTS: 3
          SCRAPE_TIMEOUT_MS: 30000
