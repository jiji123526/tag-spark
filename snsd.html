<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <style>
      html { background: #fff; }
      html.dark { background: #0c1016; }
    </style>

    <title>SNSDFF</title>
    <meta name="description" content="SNSDFF에서 작품을 읽고 추천하세요." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#0c1016");
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SNSDFF" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="SNSDFF" />
    <meta property="og:description" content="SNSDFF에서 작품을 읽고 추천하세요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SNSDFF" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://kwkrecom.vercel.app/snsd-og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="SNSDFF" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SNSDFF" />
    <meta name="twitter:description" content="SNSDFF에서 작품을 읽고 추천하세요." />
    <meta name="twitter:image" content="https://kwkrecom.vercel.app/snsd-og.svg" />
    <meta name="twitter:image:alt" content="SNSDFF" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
